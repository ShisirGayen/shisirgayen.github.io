<style>
:root{
  --bg:#190819;        /* Deep Plum */
  --royal:#35113D;     /* Royal Purple */
  --soft:#A64CC5;      /* Soft Purple */
  --ivory:#F5EFF2;     /* Ivory White */
  --ivory-70:rgba(245,239,242,.74);
  --ivory-55:rgba(245,239,242,.6);
  --space:clamp(20px,3vw,32px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  font-family:"Sora","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg);color:var(--ivory);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  overflow-x:hidden;position:relative;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}

/* refined waves: fine contour lines over a quiet royal-purple base */
.waves{position:fixed;left:0;right:0;bottom:0;height:50vh;z-index:0;pointer-events:none;overflow:hidden}
.waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%;will-change:transform}
.wave-a{animation:drift 90s linear infinite}
.wave-b{animation:drift 120s linear infinite reverse}
@keyframes drift{to{transform:translateX(-50%)}}

main{
  position:relative;z-index:1;flex:1;width:100%;max-width:1080px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;
  gap:clamp(32px,7vw,88px);padding:clamp(40px,7vw,80px) clamp(24px,5vw,56px);
}
.intro{order:1;min-width:0}
figure{order:2;justify-self:center;min-width:0}

h1{
  font-weight:700;font-size:clamp(3rem,9vw,6.5rem);line-height:1;letter-spacing:-.025em;
  margin-bottom:var(--space);
}
.caption{
  font-weight:300;font-size:clamp(1.02rem,2.3vw,1.25rem);line-height:1.7;
  color:var(--ivory-70);max-width:30ch;margin-bottom:calc(var(--space) * 1.4);
}

.email{
  display:inline-flex;align-items:center;gap:12px;max-width:100%;
  padding:14px 26px 14px 20px;border-radius:999px;text-decoration:none;color:var(--ivory);
  background:var(--royal);border:1px solid rgba(166,76,197,.55);
  font-size:clamp(.8rem,3.6vw,.97rem);font-weight:400;letter-spacing:.01em;overflow-wrap:anywhere;
  transition:background-color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease);
}
.email svg{flex:none;width:21px;height:21px;fill:none;stroke:var(--soft);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s var(--ease)}
.email:hover,.email:focus-visible{background:#46164f;border-color:var(--soft);transform:translateY(-2px)}
.email:hover svg,.email:focus-visible svg{stroke:var(--ivory)}
.email:focus-visible{outline:2px solid var(--soft);outline-offset:4px}

/* circular portrait, subtle purple glow */
.photo{
  width:clamp(200px,32vw,360px);aspect-ratio:1/1;border-radius:50%;
  border:2px solid var(--soft);background:var(--royal);
  box-shadow:0 0 0 7px rgba(166,76,197,.1),0 0 36px 2px rgba(166,76,197,.38);
  overflow:hidden;
}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 28%}

footer{
  position:relative;z-index:1;text-align:center;padding:16px 24px 22px;
  font-size:.78rem;font-weight:300;letter-spacing:.04em;color:var(--ivory-55);
}

/* gentle fade-in on load */
.fade{opacity:0;transform:translateY(10px);animation:fade .9s var(--ease) forwards}
.fade.d1{animation-delay:.1s}.fade.d2{animation-delay:.2s}.fade.d3{animation-delay:.3s}
@keyframes fade{to{opacity:1;transform:none}}

@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr);text-align:center;gap:36px;padding-top:36px}
  figure{order:1}.intro{order:2}
  .caption{margin-left:auto;margin-right:auto}
  .photo{width:clamp(180px,54vw,280px)}
  h1{font-size:clamp(2.7rem,13vw,4.5rem)}
}
@media (max-width:360px){.email{padding:12px 18px 12px 16px;gap:10px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .fade{opacity:1;transform:none}
}
